<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clera — Practice CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1B1B; --ink-2:#16302E; --paper:#F6F7F4; --surface:#FFFFFF;
    --jade:#15A37A; --jade-deep:#0E7D5E; --jade-soft:#E3F1EB;
    --amber:#D8923A; --amber-soft:#F6E9D5;
    --red:#C0432F; --red-soft:#F7E2DD;
    --blue:#2C6E8F; --blue-soft:#E3EDF1;
    --line:#DDE3DD; --muted:#5C6B66; --muted-2:#8A968F;
    --display:'Bricolage Grotesque',sans-serif; --body:'Hanken Grotesk',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  button{font-family:var(--body);cursor:pointer}
  input,select,textarea{font-family:var(--body)}
  ::selection{background:var(--jade-soft)}

  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .sidebar{background:var(--ink);color:#CFE0DA;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:21px;color:#fff;padding:22px 22px 16px;letter-spacing:-.02em}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--jade);box-shadow:0 0 0 4px rgba(21,163,122,.22)}
  .nav{padding:6px 12px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:#9DB3AC;font-size:14px;font-weight:500;padding:10px 13px;border-radius:9px;transition:all .15s}
  .nav button svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.active{background:var(--jade);color:#fff}
  .nav .tag{margin-left:auto;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.14);padding:2px 7px;border-radius:20px}
  .nav button.active .tag{background:rgba(255,255,255,.25)}
  .side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#7C928B}

  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em}
  .topbar .date{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
  .top-actions{display:flex;align-items:center;gap:10px}
  .content{padding:28px 30px 60px}

  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;padding:10px 16px;border-radius:9px;border:1px solid transparent;transition:all .15s}
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
  .btn-primary{background:var(--jade);color:#fff}.btn-primary:hover{background:var(--jade-deep)}
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}.btn-ghost:hover{border-color:var(--ink)}
  .btn-sm{padding:7px 12px;font-size:13px}
  .btn-link{background:none;border:none;color:var(--jade-deep);font-weight:600;font-size:13px;padding:4px}.btn-link:hover{text-decoration:underline}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .kpi .label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .kpi .num{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.03em;margin-top:8px;line-height:1}
  .kpi .sub{font-size:12.5px;color:var(--muted);margin-top:6px}
  .kpi.alert .num{color:var(--red)}.kpi.warn .num{color:var(--amber)}.kpi.good .num{color:var(--jade-deep)}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .panel-head h2{font-family:var(--display);font-weight:700;font-size:16px}
  .panel-body{padding:8px 10px}
  .panel.full{margin-bottom:20px}

  .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 12px;border-radius:10px}
  .row+.row{border-top:1px solid #EEF1ED}
  .row:hover{background:var(--paper)}
  .row .who{font-weight:600;font-size:14.5px}
  .row .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px}
  .row .right{display:flex;align-items:center;gap:10px}

  .tbl{width:100%;border-collapse:collapse;background:var(--surface)}
  .tbl th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:13px 16px;border-bottom:1px solid var(--line)}
  .tbl td{padding:14px 16px;border-bottom:1px solid #EEF1ED;font-size:14px;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr:hover td{background:var(--paper)}
  .tbl .name{font-weight:600}.tbl .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

  .chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;padding:5px 10px;border-radius:30px;white-space:nowrap}
  .chip.red{background:var(--red-soft);color:#8c2c1d}.chip.amber{background:var(--amber-soft);color:#915a13}
  .chip.blue{background:var(--blue-soft);color:#1f5168}.chip.green{background:var(--jade-soft);color:var(--jade-deep)}
  .chip.grey{background:#EAEEEB;color:#56635d}
  .chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .type-tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--paper);border:1px solid var(--line);padding:3px 8px;border-radius:6px;white-space:nowrap}
  .svc{display:inline-block;font-size:11px;color:var(--ink-2);background:var(--jade-soft);padding:2px 8px;border-radius:20px;margin:2px 3px 2px 0}
  .recur-tag{font-family:var(--mono);font-size:10px;color:var(--blue);margin-left:6px}

  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--surface)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
  .search input:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px rgba(21,163,122,.14)}
  .filter-pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{font-size:13px;font-weight:500;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty .big{font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink);margin-bottom:6px}

  /* kanban */
  .board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
  .col{background:var(--surface);border:1px solid var(--line);border-radius:13px;display:flex;flex-direction:column;min-height:120px}
  .col-head{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .col-head .t{font-family:var(--display);font-weight:600;font-size:13.5px}
  .col-head .v{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .col-body{padding:10px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:60px;transition:background .15s}
  .col-body.over{background:var(--jade-soft)}
  .lead{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px;cursor:grab}
  .lead:active{cursor:grabbing}
  .lead .ln{font-weight:600;font-size:14px}
  .lead .lm{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
  .lead .lf{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
  .lead .val{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink)}
  .temp{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px}
  .temp.cold{background:var(--blue-soft);color:#1f5168}.temp.warm{background:var(--amber-soft);color:#915a13}.temp.hot{background:var(--red-soft);color:#8c2c1d}

  /* calendar */
  .cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
  .cal-head h2{font-family:var(--display);font-weight:700;font-size:18px}
  .cal-nav button{background:var(--paper);border:1px solid var(--line);width:32px;height:32px;border-radius:8px;font-size:16px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal-dow{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .cal-cell{min-height:96px;border-right:1px solid #EEF1ED;border-bottom:1px solid #EEF1ED;padding:7px 8px;font-size:12px}
  .cal-cell:nth-child(7n){border-right:none}
  .cal-cell.dim{background:#FBFBFA;color:var(--muted-2)}
  .cal-cell.today .dn{background:var(--jade);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
  .cal-cell .dn{font-weight:600;font-size:12.5px}
  .cal-ev{margin-top:5px;font-size:10.5px;padding:3px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-ev.red{background:var(--red-soft);color:#8c2c1d}.cal-ev.amber{background:var(--amber-soft);color:#915a13}
  .cal-ev.blue{background:var(--blue-soft);color:#1f5168}.cal-ev.grey{background:#EAEEEB;color:#56635d}.cal-ev.green{background:var(--jade-soft);color:var(--jade-deep)}

  /* onboarding */
  .agent-card{background:linear-gradient(135deg,var(--ink),var(--ink-2));color:#EAF1EE;border-radius:16px;padding:24px 26px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
  .agent-card h2{font-family:var(--display);font-weight:700;font-size:20px;color:#fff;margin-bottom:6px}
  .agent-card p{font-size:14px;color:#A9C0BA;max-width:52ch}
  .agent-badge{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#7FD9BC;margin-bottom:10px;display:inline-block}
  .onb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
  .onb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .onb-top h3{font-family:var(--display);font-weight:700;font-size:17px}
  .progress{height:7px;background:var(--paper);border-radius:20px;overflow:hidden;margin:10px 0 16px}
  .progress span{display:block;height:100%;background:var(--jade);border-radius:20px;transition:width .3s}
  .step{display:flex;align-items:center;gap:11px;padding:9px 4px}
  .step input{width:18px;height:18px;accent-color:var(--jade);cursor:pointer}
  .step.done label{text-decoration:line-through;color:var(--muted)}
  .step label{font-size:14px;cursor:pointer}

  .overlay{position:fixed;inset:0;background:rgba(14,27,27,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
  .overlay[hidden]{display:none}
  .modal{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 40px 80px -30px rgba(14,27,27,.6)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 4px}
  .modal-head h3{font-family:var(--display);font-weight:700;font-size:20px}
  .x{background:none;border:none;font-size:24px;color:var(--muted);width:32px;height:32px;border-radius:8px}.x:hover{background:var(--paper)}
  .modal-body{padding:14px 24px 24px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--paper)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px rgba(21,163,122,.14)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
  .ai-note{background:var(--jade-soft);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--jade-deep);font-family:var(--mono);margin-bottom:14px}

  /* slide-in detail drawer */
  .drawer-scrim{position:fixed;inset:0;background:rgba(14,27,27,.42);backdrop-filter:blur(2px);z-index:110;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .drawer-scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:absolute;top:0;right:0;height:100%;width:430px;max-width:92vw;background:var(--surface);box-shadow:-30px 0 80px -30px rgba(14,27,27,.55);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);overflow-y:auto}
  .drawer-scrim.open .drawer{transform:translateX(0)}
  .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:24px 24px 18px;border-bottom:1px solid var(--line)}
  .drawer-body{padding:20px 24px;flex:1}
  .drawer-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .dl-list{display:flex;flex-direction:column}
  .dl-item{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #EEF1ED}
  .dl-item:last-child{border-bottom:none}
  .dl-item .k{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:2px;white-space:nowrap}
  .dl-item .v{font-size:14px;font-weight:600;text-align:right}
  .dl-item .btn-link{padding:0}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:11px;font-size:14px;font-weight:500;box-shadow:0 20px 40px -16px rgba(0,0,0,.5);opacity:0;transition:all .25s;z-index:200;display:flex;align-items:center;gap:9px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .tk{color:var(--jade)}

  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:20px}
  .detail-head h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em}
  .detail-grid{display:grid;grid-template-columns:repeat(4,auto);gap:10px 34px;margin-top:14px}
  .detail-grid .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .detail-grid .v{font-size:14px;font-weight:500;margin-top:2px}

  .big-val{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1}
  .big-val span{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
  .lead-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .trange{width:100%;height:7px;accent-color:var(--blue);cursor:pointer}
  .trange.t-cold{accent-color:var(--blue)}.trange.t-warm{accent-color:var(--amber)}.trange.t-hot{accent-color:var(--red)}
  .trange-labels{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .trange-labels span.on{color:var(--ink);font-weight:600}
  .note-item{padding:11px 4px;border-bottom:1px solid #EEF1ED;font-size:14px}
  .note-item:last-child{border-bottom:none}
  .note-item .note-d{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:3px}
  .qrow{display:flex;gap:8px;align-items:center;margin-bottom:9px}
  .qrow input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--paper)}
  .qrow input:first-child{flex:1}.qrow input[type=number]{width:108px}
  .qrow .x{font-size:20px;width:30px;height:30px}
  .qtotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:18px}

  /* AI animations */
  .dots{display:inline-flex;gap:4px;align-items:center}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--jade);animation:bounce 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .draft-box{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;min-height:130px;white-space:pre-wrap;font-size:13.5px;line-height:1.6;color:var(--ink);display:flex;align-items:center;justify-content:center}
  .draft-box.ready{display:block;animation:fade .4s}
  .ac-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;transition:all .25s}
  .ac-row.active{border-color:var(--jade);background:var(--jade-soft)}
  .ac-state{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:66px;text-align:right}
  .ac-state.drafting{color:var(--jade-deep)}
  .ac-state.sent{color:var(--jade-deep);font-weight:600;animation:fade .3s}
  /* score slider */
  input[type=range].score{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--amber),var(--red));cursor:pointer}
  input[type=range].score::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:grab}
  input[type=range].score::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.12)}
  input[type=range].score::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:grab}
  /* temperature board */
  .board-temp{grid-template-columns:repeat(3,1fr)}
  .col-hot{border-top:3px solid var(--red)}.col-warm{border-top:3px solid var(--amber)}.col-cold{border-top:3px solid var(--blue)}
  .lead{animation:fade .25s}
  /* onboarding agent */
  .step{transition:background .3s;border-radius:8px;padding-left:6px}
  .step.working{background:var(--jade-soft)}
  .step.working label::after{content:' · working…';font-family:var(--mono);font-size:11px;color:var(--jade-deep)}
  .step.justdone{animation:flashg .9s}
  @keyframes flashg{0%{background:var(--jade-soft)}100%{background:transparent}}

  /* auth gate */
  .auth-gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:300;padding:24px}
  .auth-gate[hidden]{display:none}
  .auth-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 32px;width:100%;max-width:380px;box-shadow:0 40px 80px -30px rgba(14,27,27,.4)}
  .auth-card h2{font-family:var(--display);font-weight:700;font-size:20px;margin:14px 0 4px}

function daysTo(iso){return Math.round((new Date(iso+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/86400000);}
function relative(iso){const n=daysTo(iso);if(n<0)return Math.abs(n)+(Math.abs(n)===1?' day overdue':' days overdue');if(n===0)return'Due today';if(n===1)return'Due tomorrow';return'in '+n+' days';}
function urgency(iso,done){if(done)return{cls:'green',label:'Done'};const n=daysTo(iso);if(n<0)return{cls:'red',label:'Overdue'};if(n<=7)return{cls:'amber',label:'Due soon'};if(n<=30)return{cls:'blue',label:'Upcoming'};return{cls:'grey',label:'Scheduled'};}
function addInterval(iso,recur){const d=new Date(iso+'T00:00:00');if(recur==='Monthly')d.setMonth(d.getMonth()+1);else if(recur==='Quarterly')d.setMonth(d.getMonth()+3);else if(recur==='Annual')d.setFullYear(d.getFullYear()+1);return d.toISOString().slice(0,10);}
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function scoreToTemp(s){return s<34?'cold':s<67?'warm':'hot';}
function tempToScore(t){return t==='hot'?85:t==='warm'?55:20;}
// Tries the real AI; falls back to a template so it always works (incl. when self-hosted).
// Calls your secure Supabase Edge Function (keeps the API key server-side).
// Falls back to a template if the backend isn't reachable, so it never breaks.
async function aiGenerate(prompt,fallback){
  if(!window.sb)return fallback;
  try{
    const {data,error}=await sb.functions.invoke('ai-chase',{body:{prompt}});
    if(error||!data||!data.text)return fallback;
    return data.text;
  }catch(e){return fallback;}
}

let current='dashboard',activeClient=null,activeLead=null;
let filters={clientSearch:'',deadlineFilter:'all',docFilter:'all'};let leadGroup='stage';
let calRef=new Date();
const TITLES={dashboard:'Dashboard',leads:'Leads pipeline',clients:'Clients',calendar:'Calendar',deadlines:'Deadlines',documents:'Document chasing',tasks:'Tasks',onboarding:'Onboarding',settings:'Settings'};

$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;current=b.dataset.view;activeClient=null;activeLead=null;$$('#nav button').forEach(x=>x.classList.toggle('active',x===b));render();});
function go(v){current=v;activeClient=null;activeLead=null;$$('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render();}

function setTopActions(){
  const a=$('#topActions');
  const nb=(l,fn)=>'<button class="btn btn-primary" onclick="'+fn+'"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'+l+'</button>';
  if(current==='clients')a.innerHTML=nb('New client','formClient()');
  else if(current==='leads')a.innerHTML=nb('New lead','formLead()');
  else if(current==='deadlines')a.innerHTML=nb('New deadline','formDeadline()');
  else if(current==='documents')a.innerHTML=nb('Request document','formDoc()');
  else if(current==='tasks')a.innerHTML=nb('New task','formTask()');
  else if(current==='onboarding')a.innerHTML=nb('Start onboarding','startOnboarding()');
  else if(current==='dashboard')a.innerHTML='<button class="btn btn-ghost btn-sm" onclick="formLead()">New lead</button>'+nb('New deadline','formDeadline()');
  else a.innerHTML='';
}

function render(){
  $('#viewTitle').textContent=TITLES[current];
  $('#t-leads').textContent=store.leads().filter(l=>l.stage!=='won'&&l.stage!=='lost').length;
  $('#t-clients').textContent=store.clients().length;
  $('#t-deadlines').textContent=store.deadlines().filter(d=>!d.done).length;
  $('#t-docs').textContent=store.documents().filter(d=>d.status!=='received').length;
  $('#t-tasks').textContent=store.tasks().filter(t=>!t.done).length;
  setTopActions();
  if(window.scheduleSave)scheduleSave();
  if(activeClient)return viewClient(activeClient);
  if(activeLead)return viewLead(activeLead);
  ({dashboard:viewDashboard,leads:viewLeads,clients:viewClients,calendar:viewCalendar,deadlines:viewDeadlines,documents:viewDocuments,tasks:viewTasks,onboarding:viewOnboarding,settings:viewSettings}[current])();
}

let dragLead=null;
function leadActivityFeed(open){const acts=[];open.forEach(l=>{(l.notes||[]).slice(0,3).forEach(n=>acts.push({name:l.name,id:l.id,date:n.date,text:n.text}));});const feed=acts.slice(0,8);return feed.length?feed.map(a=>`<div class="row" onclick="openLead('${a.id}')" style="cursor:pointer"><div><div class="who">${a.text}</div><div class="meta">${a.name} · ${a.date}</div></div></div>`).join(''):'<div class="empty" style="padding:30px"><div class="big">No activity yet</div>Open a lead and log a note, email or quote — the summary shows here.</div>';}
function pipelineSummary(open){const total=open.filter(l=>l.stage!=='won').reduce((s,l)=>s+(+l.value||0),0);return STAGES.map(([k,v])=>{const items=open.filter(l=>l.stage===k);return `<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span style="font-weight:600;font-size:14px">${v}</span><span style="font-family:var(--mono);font-size:12px;color:var(--muted)">${items.length} · ${gbp(items.reduce((s,l)=>s+(+l.value||0),0))}</span></div>`;}).join('')+`<div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0 2px"><span style="font-family:var(--display);font-weight:700;font-size:15px">Total open</span><span style="font-family:var(--mono);font-weight:700;font-size:15px">${gbp(total)}</span></div>`;}
function viewLeads(){
  const open=store.leads().filter(l=>l.stage!=='lost');
  const pipeline=open.filter(l=>l.stage!=='won').reduce((s,l)=>s+(+l.value||0),0);
  const won=store.leads().filter(l=>l.stage==='won').reduce((s,l)=>s+(+l.value||0),0);
  const byTemp=leadGroup==='temp';

  $('#view').innerHTML=`
    <div class="toolbar">
      <div class="filter-pills">
        <button class="pill ${!byTemp?'on':''}" onclick="leadGroup='stage';viewLeads()">By stage</button>

      const items=byTemp?open.filter(l=>l.temp===key):open.filter(l=>l.stage===key);

      const dropFn=byTemp?"dropLeadTemp(event,'"+key+"')":"dropLead(event,'"+key+"')";
      return `<div class="col ${byTemp?'col-'+key:''}"><div class="col-head"><span class="t">${label}</span><span class="v">${items.length} · ${gbp(val)}</span></div>
        <div class="col-body" ondragover="allowDrop(event)" ondragleave="this.classList.remove('over')" ondrop="${dropFn}">

      <div class="panel"><div class="panel-head"><h2>Recent lead activity</h2><span class="chip green"><span class="d"></span>summaries</span></div><div class="panel-body">${leadActivityFeed(open)}</div></div>
      <div class="panel"><div class="panel-head"><h2>Pipeline summary</h2></div><div class="panel-body" style="padding:14px 18px">${pipelineSummary(open)}</div></div>

function dropLeadTemp(e,temp){e.preventDefault();e.currentTarget.classList.remove('over');if(!dragLead)return;const l=store.leads().find(x=>x.id===dragLead);if(l&&l.temp!==temp){store.update('leads',l.id,{temp,score:tempToScore(temp)});toast('Rated '+temp);render();}dragLead=null;}
function leadCard(l){return `<div class="lead" draggable="true" ondragstart="dragLead='${l.id}'" onclick="openLead('${l.id}')">
  <div class="ln">${l.name}</div><div class="lm">${l.source} · ${l.contact}</div>
  <div class="lf"><span class="val">${gbp(l.value)}/yr</span><span class="temp ${l.temp}">${l.temp}</span></div></div>`;}
function allowDrop(e){e.preventDefault();e.currentTarget.classList.add('over');}
function dropLead(e,stage){e.preventDefault();e.currentTarget.classList.remove('over');if(!dragLead)return;const l=store.leads().find(x=>x.id===dragLead);if(l&&l.stage!==stage){store.update('leads',l.id,{stage});if(stage==='won')promptConvert(l.id);else toast('Moved to '+stage);render();}dragLead=null;}
function formLead(id){
  const l=id?store.leads().find(x=>x.id===id):{name:'',contact:'',email:'',phone:'',source:'Referral',value:0,temp:'cold',stage:'new'};
  openModal(id?'Edit lead':'New lead',`
    <div class="field"><label>Lead / business name</label><input id="l_name" value="${l.name}"></div>
    <div class="field-row"><div class="field"><label>Contact</label><input id="l_contact" value="${l.contact}"></div><div class="field"><label>Phone</label><input id="l_phone" value="${l.phone||''}"></div></div>
    <div class="field"><label>Email</label><input id="l_email" value="${l.email||''}"></div>
    <div class="field-row">
      <div class="field"><label>Source</label><select id="l_source">${['Referral','LinkedIn','Website','Walk-in','Other'].map(o=>'<option '+(o===l.source?'selected':'')+'>'+o+'</option>').join('')}</select></div>
      <div class="field"><label>Est. annual value (£)</label><input type="number" id="l_value" value="${l.value||0}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Temperature</label><select id="l_temp">${['cold','warm','hot'].map(o=>'<option '+(o===l.temp?'selected':'')+'>'+o+'</option>').join('')}</select></div>
      <div class="field"><label>Stage</label><select id="l_stage">${STAGES.concat([['lost','Lost']]).map(([k,v])=>'<option value="'+k+'" '+(k===l.stage?'selected':'')+'>'+v+'</option>').join('')}</select></div>
    </div>

}
function saveLead(id){
  const name=$('#l_name').value.trim();if(!name)return toast('Name is required');
  const obj={name,contact:$('#l_contact').value.trim(),phone:$('#l_phone').value.trim(),email:$('#l_email').value.trim(),source:$('#l_source').value,value:+$('#l_value').value||0,temp:$('#l_temp').value,stage:$('#l_stage').value};
  if(id){const was=store.leads().find(x=>x.id===id).stage;store.update('leads',id,obj);toast('Lead updated');if(obj.stage==='won'&&was!=='won'){closeModal();return promptConvert(id);}}
  else store.add('leads',{...obj,created:todayISO(),notes:[]}),toast('Lead added');
  closeModal();render();
}
function promptConvert(id){
  const l=store.leads().find(x=>x.id===id);if(!l)return render();
  openModal('Convert to client',`<p style="font-size:14px;color:var(--muted);margin-bottom:16px">Nice — <b>${l.name}</b> is won. Convert them into a client record and start onboarding?</p>
    <div class="modal-foot"><button class="btn btn-ghost btn-sm" onclick="closeModal();render()">Not yet</button><button class="btn btn-primary btn-sm" onclick="convertLead('${id}')">Convert & onboard</button></div>`);
}
function convertLead(id){
  const l=store.leads().find(x=>x.id===id);if(!l)return;
  const c=store.add('clients',{name:l.name,type:'Limited Company',contact:l.contact,email:l.email,phone:l.phone,services:[],yearEnd:'',ref:'',fee:l.value,feeType:'Recurring',activity:[{date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}),text:'✨ Converted from lead — onboarding started'}]});
  store.add('onboarding',{clientId:c.id,started:todayISO(),steps:ONB_STEPS.map(s=>({label:s,done:false}))});
  store.remove('leads',id);
  toast(l.name+' is now a client');closeModal();go('onboarding');
}

/* CALENDAR */
function viewCalendar(){
  const y=calRef.getFullYear(),m=calRef.getMonth();
  const first=new Date(y,m,1),start=(first.getDay()+6)%7; // Monday-start
  const days=new Date(y,m+1,0).getDate();
  const byDate={};store.deadlines().forEach(d=>{(byDate[d.due]=byDate[d.due]||[]).push(d);});
  const cells=[];
  for(let i=0;i<start;i++){const dd=new Date(y,m,-(start-1-i));cells.push({iso:dd.toISOString().slice(0,10),n:dd.getDate(),dim:true});}
  for(let d=1;d<=days;d++){const iso=new Date(y,m,d).toISOString().slice(0,10);cells.push({iso,n:d,dim:false});}
  while(cells.length%7)cells.push(null);
  const dow=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  $('#view').innerHTML=`
    <div class="cal">
      <div class="cal-head"><h2>${calRef.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h2>
        <div class="cal-nav" style="display:flex;gap:8px"><button onclick="calMove(-1)">‹</button><button onclick="calMove(0)">Today</button><button onclick="calMove(1)">›</button></div></div>
      <div class="cal-grid">${dow.map(d=>'<div class="cal-dow">'+d+'</div>').join('')}
      ${cells.map(c=>{if(!c)return '<div class="cal-cell dim"></div>';const evs=byDate[c.iso]||[];const isToday=c.iso===todayISO();
        return `<div class="cal-cell ${c.dim?'dim':''} ${isToday?'today':''}"><span class="dn">${c.n}</span>${evs.slice(0,3).map(e=>{const u=urgency(e.due,e.done);const cc=store.client(e.clientId);return '<div class="cal-ev '+u.cls+'" title="'+(cc?cc.name:'')+' — '+e.title+'">'+e.type.split(' ')[0]+' · '+(cc?cc.name.split(' ')[0]:'')+'</div>';}).join('')}${evs.length>3?'<div class="cal-ev grey">+'+(evs.length-3)+' more</div>':''}</div>`;}).join('')}
      </div></div>`;
}
function calMove(dir){if(dir===0)calRef=new Date();else calRef=new Date(calRef.getFullYear(),calRef.getMonth()+dir,1);viewCalendar();}

/* DEADLINES */
function viewDeadlines(){
  const f=filters.deadlineFilter;
  let list=store.deadlines().slice().sort((a,b)=>a.due.localeCompare(b.due));
  if(f==='overdue')list=list.filter(d=>!d.done&&daysTo(d.due)<0);
  else if(f==='soon')list=list.filter(d=>!d.done&&daysTo(d.due)>=0&&daysTo(d.due)<=7);
  else if(f==='open')list=list.filter(d=>!d.done);
  else if(f==='done')list=list.filter(d=>d.done);
  $('#view').innerHTML=`
    <div class="toolbar"><div class="filter-pills">${pill('all','All')}${pill('open','Open')}${pill('overdue','Overdue')}${pill('soon','Due soon')}${pill('done','Completed')}</div></div>

      <thead><tr><th>Deadline</th><th>Client</th><th class="hide-m">Type</th><th>Due</th><th>Status</th><th></th></tr></thead>
      <tbody>${list.length?list.map(d=>{const c=store.client(d.clientId),u=urgency(d.due,d.done);return`
        <tr><td class="name">${d.title}${d.recur&&d.recur!=='None'?'<span class="recur-tag">↻ '+d.recur+'</span>':''}</td>

      </tbody></table></div>`;
  $$('.pill').forEach(p=>p.addEventListener('click',()=>{filters.deadlineFilter=p.dataset.f;viewDeadlines();}));
}
function pill(f,label){return '<button class="pill '+(filters.deadlineFilter===f?'on':'')+'" data-f="'+f+'">'+label+'</button>';}
function toggleDeadline(id){
  const d=store.deadlines().find(x=>x.id===id);const wasDone=d.done;
  store.update('deadlines',id,{done:!d.done});
  if(!wasDone&&d.recur&&d.recur!=='None'){const next=addInterval(d.due,d.recur);store.add('deadlines',{clientId:d.clientId,type:d.type,title:d.title,due:next,done:false,recur:d.recur});toast('Done — next '+d.recur.toLowerCase()+' deadline created for '+fmt(next));}

async function aiChaseOne(id){

  openModal('AI chase — '+d.item,`<div class="ai-note">AI is drafting a follow-up for ${c?c.name:'the client'}…</div><div id="draftBox" class="draft-box"><span class="dots"><i></i><i></i><i></i></span></div><div class="modal-foot"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button><button class="btn btn-primary btn-sm" id="sendChase" disabled>Send chase</button></div>`);
  const prompt='Write a short, polite, professional follow-up email from accountancy practice "'+store.state.practice.name+'" to '+(c?c.contact:'a client')+' at "'+(c?c.name:'')+'", chasing this outstanding item: "'+d.item+'" ('+relative(d.due)+'). Under 90 words, warm but clear. Output only the email body.';
  const fb='Hi '+(c?c.contact:'there')+',\n\nJust a quick reminder that we still need your '+d.item.toLowerCase()+' ('+relative(d.due)+'). Sending it across soon keeps everything on track for your deadline.\n\nIf it\'s easier, reply to this email and we can help.\n\nThanks,\n'+store.state.practice.name;

}
async function runAutoChase(){
  const docs=store.documents().filter(d=>d.status!=='received');
  if(!docs.length)return toast('Nothing to chase');
  openModal('AI auto-chase',`<div class="ai-note">The agent is drafting and sending a tailored follow-up to each client…</div>
    <div class="progress" style="margin-bottom:16px"><span id="acBar" style="width:0%"></span></div>
    <div id="acList">${docs.map(d=>{const c=store.client(d.clientId);return '<div class="ac-row" id="ac-'+d.id+'"><div><div style="font-weight:600;font-size:14px">'+d.item+'</div><div style="font-family:var(--mono);font-size:11px;color:var(--muted)">'+(c?c.name:'')+'</div></div><span class="ac-state" id="acs-'+d.id+'">queued</span></div>';}).join('')}</div>
    <div class="modal-foot"><button class="btn btn-ghost btn-sm" onclick="closeModal();render()">Close</button></div>`);
  let done=0;
  for(const d of docs){
    const c=store.client(d.clientId);const st=$('#acs-'+d.id);const row=$('#ac-'+d.id);
    if(st){st.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';st.className='ac-state drafting';}
    if(row)row.classList.add('active');
    const prompt='Write a short polite follow-up email from accountancy practice "'+store.state.practice.name+'" chasing "'+d.item+'" from '+(c?c.contact:'the client')+'. Under 80 words. Output only the body.';
    const fb='Hi '+(c?c.contact:'there')+', a quick reminder we still need your '+d.item.toLowerCase()+'. Please send it across when you can — thanks, '+store.state.practice.name;
    const msg=await aiGenerate(prompt,fb);
    await delay(420);
    d.messages=d.messages||[];d.messages.unshift({date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}),text:msg});
    store.update('documents',d.id,{status:'chasing',chases:(d.chases||0)+1});
    logClientActivity(d.clientId,'⚡ AI auto-chase — follow-up sent for “'+d.item+'” (chase #'+(d.chases||1)+')');
    if(st){st.textContent='✓ sent';st.className='ac-state sent';}
    if(row)row.classList.remove('active');
    done++;const bar=$('#acBar');if(bar)bar.style.width=Math.round(done/docs.length*100)+'%';
  }
  const _l=$('#acList');if(_l){const s=document.createElement('div');s.className='ai-note';s.style.marginTop='14px';s.textContent='✓ Done — chased '+docs.length+' client'+(docs.length>1?'s':'')+' and added a summary to each profile.';_l.after(s);}
  toast('AI chased '+docs.length+' client'+(docs.length>1?'s':''));
}

function onbCard(o){
  const c=store.client(o.clientId);const done=o.steps.filter(s=>s.done).length;const pct=Math.round(done/o.steps.length*100);
  return `<div class="onb">
    <div class="onb-top"><div><h3>${c?c.name:'—'}</h3><div class="meta" style="font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px">Started ${fmt(o.started)} · ${done}/${o.steps.length} complete</div></div>
      <div style="display:flex;gap:8px">${done<o.steps.length?'<button class="btn btn-primary btn-sm" onclick="runAgent(\''+o.id+'\')">⚡ Run agent</button>':''}<button class="btn btn-ghost btn-sm" onclick="aiDraft('${o.clientId}')">Draft welcome email</button>${done===o.steps.length?'<button class="btn btn-primary btn-sm" onclick="finishOnb(\''+o.id+'\')">Finish</button>':''}</div></div>
    <div class="progress"><span id="onb-${o.id}-bar" style="width:${pct}%"></span></div>
    ${o.steps.map((s,i)=>`<div class="step ${s.done?'done':''}" id="onb-${o.id}-${i}"><input type="checkbox" ${s.done?'checked':''} onchange="toggleStep('${o.id}',${i})"><label>${s.label}</label></div>`).join('')}
    ${(o.log&&o.log.length)?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><div style="font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Agent activity</div>${o.log.slice(0,5).map(a=>'<div style="display:flex;gap:10px;font-size:13px;padding:3px 0"><span style="font-family:var(--mono);font-size:10.5px;color:var(--muted);min-width:46px">'+a.date+'</span><span>'+a.text+'</span></div>').join('')}</div>`:''}
  </div>`;
}
function toggleStep(id,i){const o=store.onboarding().find(x=>x.id===id);o.steps[i].done=!o.steps[i].done;render();}
async function runAgent(onbId){
  const o=store.onboarding().find(x=>x.id===onbId);if(!o)return;
  const c=store.client(o.clientId);
  for(let i=0;i<o.steps.length;i++){
    if(o.steps[i].done)continue;
    const el=$('#onb-'+onbId+'-'+i);if(el)el.classList.add('working');
    await delay(800);
    o.steps[i].done=true;
    const label=o.steps[i].label;
    o.log=o.log||[];o.log.unshift({date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}),text:'✓ '+label});
    logClientActivity(o.clientId,'🚀 Onboarding step done — '+label);
    if(label.includes('first document request')){
      store.add('documents',{clientId:o.clientId,item:'ID & proof of address (AML)',due:offset(7),status:'outstanding',chases:0,messages:[]});
      store.add('documents',{clientId:o.clientId,item:'Prior-year accounts & tax return',due:offset(10),status:'outstanding',chases:0,messages:[]});
    }
    if(label.includes('welcome call'))store.add('tasks',{title:'Welcome call with '+(c?c.name:'new client'),due:offset(3),done:false});
    if(el){el.classList.remove('working');el.classList.add('done','justdone');}
    const pb=$('#onb-'+onbId+'-bar');if(pb)pb.style.width=Math.round(o.steps.filter(s=>s.done).length/o.steps.length*100)+'%';
    await delay(250);
  }
  o.log=o.log||[];o.log.unshift({date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}),text:'✅ Onboarding complete — all '+o.steps.length+' steps done'});
  logClientActivity(o.clientId,'✅ Onboarding completed by AI agent — '+o.steps.length+' steps, documents requested & welcome call booked');
  toast('Agent onboarded '+(c?c.name:'client')+' — documents requested & call booked');
  await delay(400);render();
}

function saveDeadline(id){
  const obj={clientId:$('#d_client').value,type:$('#d_type').value,due:$('#d_due').value,title:$('#d_title').value.trim()||$('#d_type').value,recur:$('#d_recur').value};
  if(id){store.update('deadlines',id,obj);toast('Deadline updated');}else{store.add('deadlines',{...obj,done:false});toast('Deadline added');}
  closeModal();render();
}
function formDoc(id,clientId){
  const d=id?store.documents().find(x=>x.id===id):{clientId:clientId||(store.clients()[0]||{}).id,item:'',due:offset(7)};
  openModal(id?'Edit request':'Request a document',`
    <div class="field"><label>Client</label><select id="g_client">${clientOpts(d.clientId)}</select></div>
    <div class="field-row"><div class="field"><label>Document needed</label><input id="g_item" value="${d.item||''}" placeholder="e.g. Bank statements"></div><div class="field"><label>Needed by</label><input type="date" id="g_due" value="${d.due}"></div></div>
    <div class="modal-foot"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-primary btn-sm" onclick="saveDoc('${id||''}')">Save request</button></div>`);
}
function saveDoc(id){
  const item=$('#g_item').value.trim();if(!item)return toast('Document name required');
  const obj={clientId:$('#g_client').value,item,due:$('#g_due').value};
  if(id){store.update('documents',id,obj);toast('Request updated');}else{store.add('documents',{...obj,status:'outstanding',chases:0});toast('Document requested');}
  closeModal();render();
}
function formTask(){openModal('New task',`<div class="field"><label>Task</label><input id="k_title" placeholder="e.g. Call client re: VAT"></div><div class="field"><label>Due date</label><input type="date" id="k_due" value="${offset(2)}"></div><div class="modal-foot"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-primary btn-sm" onclick="saveTask()">Add task</button></div>`);}
function saveTask(){const title=$('#k_title').value.trim();if(!title)return toast('Task is required');store.add('tasks',{title,due:$('#k_due').value,done:false});toast('Task added');closeModal();render();}

function showAuth(){$('#authGate').hidden=false;$('.app').style.display='none';}
function hideAuth(){$('#authGate').hidden=true;$('.app').style.display='';}
async function doAuth(mode){
  const email=$('#authEmail').value.trim(),pw=$('#authPw').value,err=$('#authErr');err.hidden=true;
  if(!email||!pw){err.textContent='Enter your email and password.';err.hidden=false;return;}
  const {data,error}=mode==='up'?await sb.auth.signUp({email,password:pw}):await sb.auth.signInWithPassword({email,password:pw});
  if(error){err.textContent=error.message;err.hidden=false;return;}
  if(mode==='up'&&!data.session){err.textContent='Account created — check your email to confirm, then sign in.';err.hidden=false;return;}
  currentUser=data.user;hideAuth();await loadState();bootApp();
}
async function signOut(){if(sb){await saveNow();await sb.auth.signOut();}location.reload();}

async function init(){

  if(!configured()){bootApp();return;} // standalone/demo mode — no login, in-memory only
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(session){currentUser=session.user;hideAuth();await loadState();bootApp();}

}
